name: Baseline Evidence Record profile

on: [push, pull_request]

permissions:
  contents: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install schema validation dependencies
        run: python -m pip install check-jsonschema==0.34.1 rfc3339-validator==0.1.4
      - name: Validate the schema and examples
        run: python scripts/validate_profile_examples.py

  fixture-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact UTF-8 fixture bytes and SHA-256 digests
        run: python scripts/check_fixture_integrity.py

  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Markdown parser
        run: python -m pip install 'markdown-it-py[linkify]==4.2.0'
      - name: Check local Markdown targets and root README links
        run: python scripts/check_markdown_links.py
